name: Train sentiment model

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/train-sentiment.yml

permissions:
  contents: write

jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and Parquet dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyarrow

      - name: Train and evaluate on Sentiment140
        run: |
          python main.py train \
            --dataset sentiment140 \
            --max-samples 100000 \
            --model models/sentiment_model.pkl \
            --report reports/evaluation.txt \
            --image-report reports/evaluation_report.png

      - name: Save model and reports to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/sentiment_model.pkl reports/evaluation.txt reports/evaluation_report.png
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git commit -m "Add trained Sentiment140 model and evaluation reports"
          git push origin HEAD:main
